version: 2

models:
  - name: fact_orders
    description: "Incremental fact table of orders"
    columns:
      - name: order_id
        description: "Surrogate key for the order"
        tests:
          - not_null
          - unique

      - name: order_date
        description: "Date of the order"
        tests:
          - not_null

      - name: customer_id
        description: "Customer identifier"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: order_amount
        description: "Order value"
        tests:
          - not_null
          - no_invalid_order_amounts
