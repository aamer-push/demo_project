name: dbt Nightly

on:
  # Run every night at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual runs from GitHub UI
  workflow_dispatch:

jobs:
  nightly-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt (Postgres)
        run: |
          pip install dbt-postgres

      # ⭐ IMPORTANT ⭐
      # This compiles dbt using your CI profile at .dbt/profiles.yml
      - name: Run dbt compile (no DB needed)
        run: |
          dbt --version
          dbt compile --profiles-dir .dbt

      # Create minimal run_results.json so artifacts exist
      - name: Create run_results.json
        run: |
          mkdir -p target
          echo '{ "metadata": { "job": "nightly", "mode": "compile-only" }, "results": [] }' > target/run_results.json

      # Upload artifacts from the target folder
      - nam
